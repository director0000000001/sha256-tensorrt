[project]
name = "sha256"
version = "0.1.0"
description = "sha256 — a local-first, real-time AI avatar desktop application for Windows."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "sha256 Project" }]
keywords = ["avatar", "face-tracking", "virtual-camera", "real-time", "local-first"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video :: Capture",
]

# Runtime dependencies are deliberately minimal. Every heavy or
# license-encumbered component (torch, mediapipe, onnxruntime, pyvirtualcam)
# lives in an optional extra so the shell stays installable and testable
# without pulling multi-gigabyte wheels. See docs/OPEN_SOURCE_EVALUATION.md.
dependencies = [
    "PySide6>=6.8,<7",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "numpy>=1.26,<3",
    "platformdirs>=4.2,<5",
]

[project.optional-dependencies]
# --- Optional capability extras -------------------------------------------
# NOT installed by default. Each carries its own license and size trade-offs
# which are documented in docs/OPEN_SOURCE_EVALUATION.md before adoption.

# Face tracking backends.
#
# WARNING: mediapipe declares a hard dependency on `opencv-contrib-python`,
# which ships its own Qt and breaks PySide6 — the exact reason this project
# installs `opencv-python-headless`. Installing this extra the normal way will
# replace the headless build. On the reference machine it is installed as:
#
#     uv pip install mediapipe --no-deps
#     uv pip install absl-py certifi matplotlib
#
# (matplotlib and certifi are imported unconditionally by mediapipe's task
# modules; sounddevice and opencv-contrib-python are not needed for vision.)
tracking = ["mediapipe>=1.0,<2"]

# Inference runtimes. CUDA wheels must match the local driver; the RTX 50-series
# (Blackwell, sm_120) requires a CUDA 12.8+ build. Verify with scripts/check_gpu.py.
onnx = ["onnxruntime-gpu>=1.20"]

# WARNING: pyvirtualcam is GPL-2.0. Linking it into sha256 has copyleft
# implications for distribution. Do not enable without reading
# docs/decisions/ADR-0005-virtual-camera-strategy.md.
vcam-gpl = ["pyvirtualcam>=0.12"]

# Generating avatar source clips (scripts/generate_avatar_clips.py). A tool
# extra, not a runtime one: the application never calls a hosted model, and
# nothing in src/ imports this. It is only installed on the machine that builds
# the photograph library.
video-gen = ["google-genai>=1.0"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-qt>=4.4",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[project.scripts]
sha256 = "sha256.__main__:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sha256"]

# ---------------------------------------------------------------------------
# Ruff — linting + formatting (replaces black/isort/flake8)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtins shadowing
    "C4",       # comprehensions
    "SIM",      # simplify
    "PTH",      # use pathlib
    "RUF",      # ruff-specific
    "ANN",      # annotations
    "TID",      # tidy imports
]
ignore = [
    "ANN401",  # allow typing.Any where a boundary genuinely needs it
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101"]
"scripts/**" = ["ANN"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# mypy — strict on the contract layer, pragmatic elsewhere
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Qt's generated stubs are incomplete; do not let them block the build.
module = ["PySide6.*"]
ignore_missing_imports = true
follow_untyped_imports = true

[[tool.mypy.overrides]]
# MediaPipe ships no type information. The adapter confines it to one module and
# re-exports only sha256 types, so the untyped surface stops at that boundary.
module = ["mediapipe.*"]
ignore_missing_imports = true
follow_untyped_imports = true

[[tool.mypy.overrides]]
# pyvirtualcam ships no type information and its Windows backends are compiled
# extension modules. The sink adapter is the only module that imports it and it
# returns sha256 types, so the untyped surface stops at that boundary.
module = ["pyvirtualcam.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `scripts/` is not part of the package and is not on mypy's path — the tests
# that cover the extractor put it on `sys.path` themselves, at runtime. Checking
# it here would apply the package's strict settings to standalone tools, which
# is a separate decision from testing them.
module = ["build_turn_ladder", "extract_avatar_frames", "generate_avatar_clips"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Tests are checked, but not required to annotate every `def test_...() -> None`.
# The value of strict typing is in the contracts; enforcing it on test bodies
# is noise that discourages writing tests.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "gui: requires a Qt application instance (skipped when no display/offscreen)",
    "integration: crosses module boundaries",
    "slow: takes more than a second",
    "requires_gpu: needs a CUDA device present",
]

[tool.coverage.run]
source = ["src/sha256"]
branch = true

[tool.coverage.report]
skip_empty = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
