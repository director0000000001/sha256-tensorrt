# ---------------------------------------------------------------------------
# THE EXPRESSION CLIPS — one best frame per role, not a ladder.
#
# `want_roles` are the roles this clip exists to supply, and `min_roles` is how
# many of them have to come back before it counts as paid for. They are the
# engine's own role names (`_VARIANT_ROLES` in engine_warp), because the
# extractor classifies frames with the renderer's selector rather than by rules
# the renderer would disagree with.
#
# THREE HELD POSITIONS PER CLIP, WHICH IS WHY THERE ARE FIVE OF THEM RATHER
# THAN TWO. The generator caps at eight seconds. Only a frame taken while the
# face was still becomes a photograph, and an expression needs about two
# seconds of stillness to be caught cleanly; with a second to settle at the
# start and half a second to move between positions, eight seconds holds three.
# The earlier single "brows and eyes" prompt asked for five expressions plus
# three seconds of closed eyes — fifteen seconds of instructions inside an
# eight-second clip, which a generator resolves by rushing all of them. Rushed
# is blurred, and blurred is worthless.
#
# THE MOST IMPORTANT POSITION IS ALWAYS FIRST. If the generator runs out of
# time it loses the end of the list, so the list is ordered by what the engine
# uses most.
#
# NOT ASKED FOR, DELIBERATELY: the squint and the four gaze photographs. Both
# families were dropped from the engine on 2026-08-15 — the gaze photographs
# were never selected once in a whole recording, and the squint fired where it
# did not belong. A clip for them would buy frames nothing reads.
# ---------------------------------------------------------------------------

# SUPERSEDED FOR THE CLOSING SIDE by `eyes-slow-close` above, and it is the
# clip that caused the defect that one exists to fix: three of its eight seconds
# are held shut, which leaves the shallow bands empty and drags the ladder's
# median zero onto a shut eye. Kept because the library's shut-eye and wide-eye
# photographs came from it and are good. Do not regenerate it expecting the
# in-between rungs.
[[clip]]
id = "eyes"
order = 6
title = "Eyes closing, and a natural blink"
why = "The eyes are the owner's standing complaint. source_eyes_closed is active on 9.6% of a conversation and every blink passes through it, so the closed frame gets a clip of its own and three full seconds inside it."
check = "roles"
probe_first = false
want_roles = ["source_eyes_closed"]
min_roles = 1
body = '''
The person in the attached photograph faces the camera with the head still,
upright and centred, the mouth closed and the eyes on the lens.

They begin with a relaxed neutral face and hold completely still for one second.
They then close both eyes gently and completely, as if resting, and keep them
closed and completely motionless for three full seconds. They then open them
slowly, return to a relaxed neutral face with the eyes on the lens, and hold
completely still until the end, blinking once naturally.

The eyelids close and open smoothly and gently, never suddenly. The head does
not move at any point, the eyebrows do not move, and the mouth stays closed
throughout.
'''

# ---------------------------------------------------------------------------
# THE BROWS AND THE MOUTH, 2026-08-21, AND WHY THEY LOOK LIKE THE EYE CLIP.
#
# All three of the owner's families were measured on 2026-08-21, one photograph
# at a time, against what the manifest claims each one is:
#
#   eyes    14 rungs, ONE clip     mean error 0.095   ordered, 99% down to 34%
#   brows   13 rungs, SIX clips    mean error 0.442   5 of 7 "raised" rungs are
#                                                     photographs of LOWERED brows
#   mouth   10 rungs               mean error 0.362   smile_140 (+1.401) shows
#                                                     LESS smile than smile_108
#
# The eye ladder is the only one built from a single clip, and it is the only
# one that survives being checked. That is the whole of the difference, and the
# mechanism was measured: MediaPipe's brow landmarks are not repeatable across a
# re-detection. The same face reads 0.0650 in its source frame, 0.0831 in the
# crop cut from it and 0.0798 in a crop framed like the portrait, on an axis
# whose entire span is 0.039. Inside one continuous clip the tracker carries
# state between frames and the reading is far steadier; across six clips it is
# six different biases averaged into one axis.
#
# SO: ONE CLIP PER AXIS, and the axis built from that clip alone.
#
# AND THE SHAPE THE EYE CLIP TAUGHT. Two takes that asked the generator to close
# an eye produced a blink -- a reflex, drawn as fast as it can be -- and then a
# long hold. The take that worked never mentions closing: it asks for held steps
# and states that the extreme is never reached. These three do the same. None of
# them asks for a full raise, a hard scowl or a laugh, because what comes back
# when you ask for an extreme is the extreme and nothing on the way to it, and
# the way to it is the entire missing middle.
#
# A SECOND FINDING, FOR THE MOUTH ONLY. Its axis is driven by the mouthSmile
# blendshape, which saturates: across the whole existing ladder it moves only
# from 0.529 to 0.798, and the top five rungs sit between 0.67 and 0.80 -- five
# photographs of one smile. Measured geometrically instead, the same rungs
# separate cleanly: mouth width over eye span runs 0.586 to 0.722, and the lip
# gap divides closed smiles (0.018 to 0.023) from open ones (0.125 to 0.148)
# with nothing in between. The axis wants changing as well as the clip, and the
# clip is what supplies the frames the new axis will file.
# ---------------------------------------------------------------------------

[[clip]]
id = "brows-up-steps"
order = 1
title = "The eyebrows raised in held steps, and never fully"
why = "Five of the seven raised rungs in the library are photographs of lowered brows, and the two that are genuinely raised are both raised fully -- so the up side of the ladder is nothing, nothing, nothing, nothing, nothing, FULL, nothing, FULL. That is the owner's report that a delighted brow arrives without cause."
check = "roles"
probe_first = false
want_roles = ["source_brows_up"]
min_roles = 0
body = '''
The person in the attached photograph faces the camera with the head still,
upright and centred, the mouth closed, and the eyes open and on the lens.

They begin with a relaxed neutral face and hold it completely still for three
full seconds, the eyebrows resting in their natural position.

They then raise both eyebrows by a small amount, about a quarter of the way to
as high as they could go, and hold that position completely motionless for one
and a half seconds. Then they raise them a little further, to about half of the
way, and hold that completely motionless for one and a half seconds. Then a
little further again, to about three quarters of the way, and hold that
completely motionless until the end of the clip.

The eyebrows never reach as high as they could go. Even at the last position
there is clearly room left above them, and the face stays calm throughout: this
is not surprise and not delight, it is the same relaxed face carrying its
eyebrows a little higher at each step.

Each raise takes about a third of a second, is smooth and gentle, and ends in a
complete stop with no drift and no creeping. The eyes stay open and on the lens
the whole time and do not widen when the eyebrows move. The head does not move
at any point and the mouth stays closed. Every frame is sharp, including the
frames in which the eyebrows are part of the way up.
'''

