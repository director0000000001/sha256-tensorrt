# The second speech clip exists because eight seconds of one sentence cannot
# carry every mouth shape, and the two sentences are chosen so that between them
# they do. What clip 8 leaves uncovered, this one is built around:
#
#     f / v    upper teeth on the lower lip     "fast", "off", "for"
#     aah      jaw open, teeth visible          "fast"
#     p / b    lips fully closed, then released "pays", "numbers"
#     oo       lips rounded and pushed forward  "you", "move"
#     ee       lips wide and flat               "we", "me"
#
# The instruction that does the work is the lip-reading one: a speaker who knows
# they are being lip-read forms each shape completely and holds it for an
# instant, and an instant is all a photograph needs.
[[clip]]
id = "speech-numbers"
order = 9
title = "Speech — the value sentence, fully articulated"
why = "Eight seconds of speech cannot carry every mouth shape. This clip covers what the first speech clip does not: f and v, the open jaw, and the released p."
check = "roles"
probe_first = false
want_roles = [
    "source_mouth_open",
    "source_mouth_o",
    "source_mouth_pressed",
    "source_mouth_wide",
]
min_roles = 3
body = '''
The person in the attached photograph is a sales manager speaking directly to
the camera on a video call, talking to a client. He holds exactly the pose he
has in the photograph throughout: facing the camera straight on, head level and
centred, shoulders square, as in an identity document photograph. His eyes stay
on the camera lens the entire time, with natural blinking and only very small
head movements.

He speaks slowly and warmly, and he articulates every word as clearly and fully
as a person who knows the listener is reading his lips: every mouth shape is
completely formed, opened or closed to its full extent, and held for an instant
before the next one begins. The delivery is unhurried and never fast.

He says: "Let me show you the numbers. We move fast, and it pays off for you.
Give me five minutes, and I will walk you through it myself."

He speaks continuously from the first frame to the last, closing his mouth
completely and holding it relaxed and still for a moment between the sentences.
'''


# ---------------------------------------------------------------------------
# PARKED — generated only with --include-parked, and the reason is not caution.
#
# The tilt photographs were dropped from the engine on 2026-08-15: they were
# active on 99.2% of frames at a median weight of 0.38 and their geometry sits a
# tenth of a face away from the portrait's. What would make pitch usable is a
# ladder like the turn one, and the ladder is one-dimensional — it brackets on
# yaw and nothing else. A second axis is a real change in the engine, not a
# parameter. Until it is built, the frames from this clip have nothing to read
# them, so generating it now buys nothing.
# ---------------------------------------------------------------------------

[[clip]]
id = "tilts"
order = 10
title = "Head tilts — the second ladder, pitch"
why = "PARKED: the engine has no pitch ladder yet, so these frames would sit unused."
check = "roles"
parked = true
probe_first = false
want_roles = ["source_tilt_up", "source_tilt_down"]
min_roles = 2
body = '''
The person in the attached photograph keeps a neutral expression with the mouth
closed and the eyes open, and tilts their head up and down in a series of small
separate steps, while their shoulders and body stay square to the camera and
completely still.

They begin facing the camera with the chin level and hold completely still for
one second. They then raise the chin one small step and come to a complete stop,
holding completely motionless for about half a second; then one more small step
and another complete stop; and so on until the head is tilted as far back as it
comfortably goes, where they hold completely still. They then lower the chin the
same way, one small step and a complete stop at a time, down through level and
on until the chin is as far down toward the chest as it comfortably goes, where
they hold completely still until the end.

Every movement between one stop and the next is slow, smooth and gentle, taking
about half a second, and nothing in the shot ever looks rushed. Throughout, the
head does not turn left or right and does not tilt sideways, and the eyes stay
on the camera lens so that the head tilts but the gaze does not.
'''
