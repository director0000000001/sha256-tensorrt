want_roles = [
    "source_mouth_open",
    "source_mouth_o",
    "source_mouth_pressed",
    "source_mouth_wide",
]
min_roles = 3
body = '''
The person in the attached photograph is a sales manager speaking directly to
the camera on a video call, talking to a client. He holds exactly the pose he
has in the photograph throughout: facing the camera straight on, head level and
centred, shoulders square, as in an identity document photograph. His eyes stay
on the camera lens the entire time, with natural blinking and only very small
head movements.

He speaks slowly and warmly, and he articulates every word as clearly and fully
as a person who knows the listener is reading his lips: every mouth shape is
completely formed, opened or closed to its full extent, and held for an instant
before the next one begins. The delivery is unhurried and never fast.

He says: "Let me show you the numbers. We move fast, and it pays off for you.
