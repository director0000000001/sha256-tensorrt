body = '''
The person in the attached photograph is a sales manager speaking directly to
the camera on a video call. He holds exactly the pose he has in the photograph
throughout: facing the camera straight on, head level and centred, shoulders
square, as in an identity document photograph. His eyes stay on the camera lens
