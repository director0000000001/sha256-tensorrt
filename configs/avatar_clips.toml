# ---------------------------------------------------------------------------
# sha256 — the avatar source clips, as data.
#
# Every clip the avatar library still needs, with the prompt that produces it
# and the measurement that decides whether it came back usable. Driven by
#
#     scripts/generate_avatar_clips.py
#
# which generates, extracts, measures, and only pays again when the measurement
# says the take is unusable. The prompts also live in AVATAR_VIDEO_PROMPTS.txt
# in prose, for pasting into a web UI by hand; this file is what the tool reads.
#
# WHY THE PROMPTS READ THE WAY THEY DO. Only a frame in which the head was
# STILL becomes a photograph — a frame taken mid-movement is smeared, and
# softness is the one flaw the warp cannot recover from. The first turn clip
# swept continuously and its rungs came out at 1.5-2% of the near-eye detail of
# the single frame where the head paused. So the turn prompts ask for a series
# of full stops, and for the movement between them to be slow and unhurried
# rather than a snap, which is also what stops the clip looking rushed.
# ---------------------------------------------------------------------------

[api]
# MODEL IDS AND PRICES ARE NOT GUESSES TO TRUST — verify both before a big run:
#
#     uv run python scripts/generate_avatar_clips.py --list-models
#
# lists what this API key can actually reach, and the prices are whatever the
# billing page says today. They are here, not in the code, so a change costs an
# edit rather than a patch. Every cost the tool reports is computed from them,
# so a wrong number here makes the budget guard wrong in the same direction.
model_final = "veo-3.1-generate-preview"
model_probe = "veo-3.1-fast-generate-preview"
usd_per_second_final = 0.40
usd_per_second_probe = 0.15

# Eight seconds is the cap on the owner's plan and the reason each turn clip
# goes one way only: a return to centre would spend half the budget
# re-photographing angles already covered.
duration_seconds = 8

# The face has to be large in frame — frames are cut out of this and the base
# portrait is 1024x1024. Highest the account allows; drop to "720p" if the API
# rejects it.
#
# 9:16 SINCE 2026-08-26, AND IT IS A MEASUREMENT RATHER THAN A PREFERENCE. The
# same head is 320 px wide at 16:9 720p, 389 px in the speech clip on disk, and
# 496 px at 9:16 1080p — against a portrait whose own face is 455. Everything
# still waiting to be generated is wanted at 9:16 1080p for that one reason:
# below the portrait's own face width the frames arrive already soft, and
# softness is the single flaw the warp cannot put back.
resolution = "1080p"
aspect_ratio = "9:16"
person_generation = "allow_adult"

# How long to wait for one video, and how often to ask. Generation is minutes,
# not seconds.
poll_seconds = 15.0
timeout_seconds = 900.0

# Config fields the API rejects on some model versions. Name them here and the
# tool leaves them out of the request instead of failing — cheaper than a code
# edit when a preview model changes its accepted fields.
drop_fields = []


[defaults]
# Appended to every prompt below. One block, so the framing and the light are
# identical between clips: the engine relights the avatar to the room, and a
# source lit differently reads as a flicker when the engine switches to it.
shared = '''
Static locked-off camera at eye level, no camera movement, no zoom, no pan, no
cuts, one continuous take. Vertical portrait framing, taller than it is wide.
Close-up head-and-shoulders framing with the face filling most of the width of
the frame, centred, the whole head visible with a small margin above the hair
and the shoulders reaching the bottom edge. Soft even frontal lighting that
never changes. Plain uncluttered light grey background. Photorealistic and extremely sharp: the face is in crisp
focus in every single frame, with visible skin texture and pores, individual
eyelashes, and individual hairs in the eyebrows and the beard. No motion blur at
any point. No film grain, no colour grading, no vignette, no depth-of-field blur
on the face. The person keeps exactly the identity, hairstyle, facial hair,
clothing and skin tone of the attached photograph, and the face never changes
shape or proportions. Hands stay out of frame and nothing ever covers the face.
No on-screen text, captions or subtitles. All movements are slow and deliberate,
with each position held completely still before changing.
'''

# What the generator must not produce. The first three lines are the failures
# this project has actually paid for.
negative_prompt = '''
motion blur, blurred face, smeared face, soft focus, out of focus, fast movement,
sudden movement, jerky movement, snapping head movement, continuous sweeping
movement, camera shake, handheld camera, zoom, pan, dolly, cuts, jump cuts,
scene change, changing identity, different person, face morphing, distorted
face, warped features, changing hairstyle, changing clothing, glasses appearing,
hat, hands, hands near face, text, captions, subtitles, watermark, logo,
lighting change, moving shadows, colour shift, film grain, noise, vignette,
depth of field, background blur over the face, low resolution, compression
artifacts


'''


# ---------------------------------------------------------------------------
# THE TURN LADDER — the two clips that block the largest open item.
#
# Every turned photograph in the library is motion blurred, so the avatar is
# sharp facing forward and soft at every angle. No engine change puts back
# detail that was never photographed.
#
# DIRECTION IS STATED TWICE, TWO DIFFERENT WAYS. "Their own left" and "the
# right-hand edge of the frame" are opposite phrasings of one movement and
# agree with each other, so following either produces the same clip. The first
# stepped clip came back turning the other way and it was not knowable from the
# prompt which reading the generator had obeyed.
#
# `expect_yaw_sign` is that check, automated: HeadPose documents positive yaw as
# a turn to the subject's own left (src/sha256/core/types.py). If a clip that
# visibly turns the right way fails this check, the tracker's sign convention is
# inverted rather than the clip being wrong — flip the value here and say so.
# ---------------------------------------------------------------------------

[[clip]]
id = "turn-frame-right"
order = 4
title = "Stepped turn, face toward the RIGHT edge of frame (their own left)"
why = "The side the first clip did not cover. Half the ladder."
check = "ladder"
probe_first = true
min_rungs = 5
min_yaw_span = 25.0
max_blurred_fraction = 0.34
expect_yaw_sign = "positive"
body = '''
The person in the attached photograph keeps a neutral expression with the mouth
closed and the eyes open, and turns their head to their own left, so that in the
picture their face comes to point toward the right-hand edge of the frame. Their
shoulders and body stay square to the camera and completely still.

The very first movement of the head is in that direction. There is no small
movement the other way before it, no wind-up and no rocking back, and at no
point in the clip does the head turn back toward the camera or to the other
side.

They begin facing the camera and hold completely still for one second. They then
turn their head one small step in that direction and come to a complete stop,
holding completely motionless for about three quarters of a second; then one
more small step the same way and another complete stop, motionless again; and so
on for about five steps in total, until the head has turned roughly three
quarters of the way toward a full profile, where they hold completely still
until the end.

Every movement between one stop and the next is very slow, smooth and gentle,
taking about half a second. The head never snaps, jerks or whips around, and
nothing in the shot ever looks rushed or hurried. Each stop is a full stop, with
no drift, no settling and no slow continuous creeping: in total the head is
stationary for well over half of the eight seconds.

Throughout, the head stays perfectly upright with no tilt up, down or sideways,
the chin stays level, and the eyes stay on the camera lens so that the head
turns but the gaze does not. The expression never changes, and the face stays in
sharp focus at every angle.
'''

