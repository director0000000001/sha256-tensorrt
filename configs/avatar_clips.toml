order = 4
title = "Brows raised, brows drawn down, eyes wide"
why = "source_brows_up is active on 56.5% of a conversation and source_brows_down on 34.4% — between them 91% of ordinary speech, on photographs that have never been sharp."
check = "roles"
probe_first = false
want_roles = ["source_brows_up", "source_brows_down", "source_eyes_wide"]
min_roles = 2
body = '''
The person in the attached photograph faces the camera with the head still,
upright and centred, and the mouth closed and the eyes on the lens. They move
through three expressions, holding each one completely motionless for two
