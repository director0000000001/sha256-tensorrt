order = 10
title = "Smiles and laughter"
why = "The smile family is still separately generated stills, which is exactly where identity drift comes from — within one clip it cannot happen."
check = "roles"
probe_first = false
want_roles = ["source_smile", "source_smile_closed"]
min_roles = 2
body = '''
The person in the attached photograph faces the camera with the head still,
upright and centred, and the eyes on the lens. They move through three
expressions, holding each one completely motionless for two seconds, and
returning briefly to a relaxed neutral face between them.

They begin relaxed and hold still for one second. First a gentle closed-mouth
smile, with the lips together and the corners of the mouth raised, and hold
completely still. Then relaxed. Then a warm open smile showing the upper teeth,
and hold completely still. Then relaxed. Then a genuine happy laugh with the
mouth open and the eyes narrowing, and hold completely still until the end.

Every change from one expression to the next is slow and gentle, never sudden,
and each expression is completely motionless while it is held. The head does not
move at any point and the eyes stay on the camera lens throughout.
'''

# REVISED 2026-08-26, and the revision is the whole point of it.
#
# The take on disk is 720p 16:9 with a 389 px face against the portrait's 455.
# Above a mouth parting of 0.6 — 21% of speech frames — it is the only material
# the library has, and the owner named both of its faults on sight: the beard,
# and the thickness of the lips. Neither is reachable by a tone transform;
# offset, gain, and gain-and-offset all left 3 to 15 of residual over the beard,
# because the two generations simply drew that beard differently.
#
# So three things changed, and each answers a measurement:
#
#   9:16 at 1080p        496 px of face instead of 389.
#   the lip-reading line  taken from speech-numbers, which is the instruction
#                         that makes a shape fully formed and held. A grid cell
#                         holding one frame is dropped, so a shape has to be
#                         held to become a rung at all.
#   the open jaw, named   the grid is thin above a parting of 0.6, and nothing
#                         in the old sentence asks the jaw to drop all the way.
#                         "Ah", "Thank", "asking", "has" are there to buy it.
#
# The sentence stays ONE sentence for eight seconds. Fifteen seconds of speech
# inside an eight-second cap is what made the generator rush, and a rushed mouth
# is a blurred frame. Longer is bought by extending the take or by generating
# speech-numbers beside it, never by asking for more words in the same eight.
[[clip]]
id = "speech"
order = 11
title = "Speech — a sales manager on a first call"
why = "The case the avatar spends almost all its time in, and the only clip that gives the mouth shapes in the order real speech puts them. Also the closest thing to training footage for the refiner."
check = "roles"
probe_first = false
want_roles = [
    "source_mouth_open",
    "source_mouth_o",
    "source_mouth_pressed",
    "source_mouth_wide",
    "source_smile",
]
min_roles = 3
body = '''
The person in the attached photograph is a sales manager speaking directly to
the camera on a video call. He holds exactly the pose he has in the photograph
throughout: facing the camera straight on, head level and centred, shoulders
square, as in an identity document photograph. His eyes stay on the camera lens
the entire time, with natural blinking and only very small head movements.

He speaks warmly and very slowly, and he articulates every word as fully as a
person who knows the listener is reading his lips: every mouth shape is
completely formed, opened or closed to its full extent, and held completely
still for an instant before the next one begins. Wherever the word opens the
jaw, the jaw drops all the way and the wide open mouth is held still for an
instant as well.

He says: "Ah, hello. Thank you for asking. Let me show you what my team has
made."

He speaks continuously from the first frame to the last, and between the
sentences he closes his mouth completely and holds it relaxed and still for a
moment. The delivery is unhurried throughout and never fast.

His beard, moustache and lips stay exactly as they are in the attached
photograph in every single frame: the same beard density and the same beard
edge, and lips of exactly the same thickness and colour.
'''

# The second speech clip exists because eight seconds of one sentence cannot
# carry every mouth shape, and the two sentences are chosen so that between them
# they do. What clip 8 leaves uncovered, this one is built around:
#
#     f / v    upper teeth on the lower lip     "fast", "off", "for"
#     aah      jaw open, teeth visible          "fast"
#     p / b    lips fully closed, then released "pays", "numbers"
#     oo       lips rounded and pushed forward  "you", "move"
#     ee       lips wide and flat               "we", "me"
#
# The instruction that does the work is the lip-reading one: a speaker who knows
# they are being lip-read forms each shape completely and holds it for an
# instant, and an instant is all a photograph needs.
[[clip]]
id = "speech-numbers"
order = 12
