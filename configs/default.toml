# ---------------------------------------------------------------------------
# sha256 — baseline configuration (committed).
#
# Per-machine overrides belong in `configs/local.toml`, which is gitignored.
# Environment variables (SHA256_*) override both. See docs/development/.
#
# Every backend is `null` during the foundation phase: the placeholders keep
# the application runnable end-to-end while real backends are still being
# selected. See docs/OPEN_SOURCE_EVALUATION.md.
# ---------------------------------------------------------------------------

environment = "development"
log_level = "INFO"
log_json = false
developer_mode = false

[camera]
backend = "null"
device_index = 0
width = 1280
height = 720
target_fps = 30.0
mirror = true

[tracking]
# Real backend since day 3. Needs the model bundle on disk — fetch it once with
#   python scripts/fetch_face_landmarker.py
# Without it, starting the pipeline fails with a message naming that script.
backend = "mediapipe"
# Three different questions, and only the first one is about *finding* a face.
#
# The owner turned their head far enough that the tracker lost them, and the
# engine then froze the avatar rather than ever showing the real face — the
# right rule, and it reads as the face vanishing. Measured on a clip that sweeps
# smoothly past profile, 192 frames:
#
#     detection  presence  tracking   tracked   worst frame-to-frame jump
#           0.5       0.5       0.5     158/192            5.5% of face width
#           0.5       0.2       0.2     162/192            5.5%
#           0.5       0.1       0.1   **165/192**          8.0%
#           0.3       0.1       0.1     166/192            6.6%
#
# Presence and tracking govern *holding* a face already found, so those come
# down. Detection stays at 0.5 because it governs acquisition, and a permissive
# detector is the one that would claim a face on an empty chair.
#
# Verified not to be buying frames with rubbish: on the owner's own recording
# all 1847 frames track at every setting with identical jitter (p50 0.27%, p99
# 5.7%), and plain grey, random noise and a blurred empty scene produce zero
# detections at every setting, including 0.1.
#
# It moves the wall, it does not remove it. Past roughly 65 degrees there is not
# enough face pointed at the camera to track, and a live 720p face is smaller
# than the one measured here, so the live limit is lower.
min_detection_confidence = 0.5
min_presence_confidence = 0.1
min_tracking_confidence = 0.1
num_faces = 1

# 'auto' resolves to CPU on Windows: the published MediaPipe wheel is built
# without a GPU delegate. Measured, not assumed — docs/benchmarks/B003.
delegate = "auto"

# Landmark jitter moves the avatar's mask edge a pixel or two every frame, which
# reads as a shimmer around the face. Smoothing steadies it. 0.35 costs roughly
# half a frame of latency — well inside the 100 ms where lip sync starts to
# drift — and is the first thing to lower if the avatar feels laggy.
smoothing = 0.35

# The lips can be filtered separately, and **they are not, by default, because
# he judged the unfiltered version worse in the application on 2026-09-03.**
#
# The measurement said the opposite, and it is worth stating plainly rather than
# quietly reverting. Unfiltered, on the speech window of `recordings/driving.mkv`
# through the real tracker and the real engine, the photograph on screen sat
# **0.054 from his real mouth against 0.080** on both axes together, used the
# same 44 rungs, and changed slightly *less* often. His eye disagreed: *"now the
# result is worse — the mouth barely follows, it has closed up, it does not move
# freely, and it seems some of the photographs it used before are no longer
# used."*
#
# **His eye has been right against these numbers repeatedly, so the setting goes
# back to matching `smoothing` until the difference is reproduced on frames from
# his own session rather than on a clip from 2026-08-14.** The knob and its
# tests stay: what is wrong is not knowing which of the two is right, and a
# setting that can be moved in one line is how that gets answered.
mouth_smoothing = 0.35

[engine]
# Warps the avatar portrait onto the tracked face. Deterministic, CPU-only, and
# free of model-weight licensing risk. Not photorealistic synthesis — see
# docs/OPEN_SOURCE_EVALUATION.md for why LivePortrait is still the quality goal.
backend = "warp"
device = "auto"
precision = "auto"

[rendering]
backend = "null"
output_width = 1280
output_height = 720
target_fps = 30.0

[virtual_camera]
# `null` counts frames and discards them. It stays the committed default on
# purpose: the only working backend today is `pyvirtualcam`, which is GPL-2.0
# and must never reach a distributed build by inheriting a default nobody chose.
# Turn it on per machine in configs/local.toml, which is gitignored:
#
#     [virtual_camera]
#     backend = "pyvirtualcam"
#
# It writes to an existing device — install OBS Studio once to register one.
# OBS does not need to be running. See ADR-0005 and docs/benchmarks/B004.
backend = "null"

# Only used by a backend that creates its own device. `pyvirtualcam` writes to
# somebody else's and reports the real name back instead.
device_name = "sha256 Virtual Camera"

# Exact OS device to bind to, e.g. "OBS Virtual Camera". Empty picks the first
# that works, which is right unless a machine has several.
# device = "OBS Virtual Camera"

# Publishing starts from the window's checkbox, not at launch: appearing in
# every application's camera list before anyone asked for it is not acceptable.
auto_start = false

[gpu]
# Conservative default for a 16 GB card: leaves headroom for the desktop
# compositor, the browser running the video call, and the encoder.
# Revisit once real engines have been profiled — see docs/benchmarks/.
vram_budget_mb = 6144
allow_fallback_to_cpu = true

[avatars]
library_path = "avatars"

# Selected at startup so the application opens ready to run. An avatar that
# fails to load is reported and the app still starts.
default_avatar_id = "my_avatar"
max_resident = 2
verify_checksums = false

[performance]
enabled = true
window_size = 240
sample_system_metrics = false
system_sample_interval = 1.0

[ui]
# Background photograph for the window. Drop a file at this path and it is
# used; leave the path empty, or the file absent, and the plain colour is used
# instead. Pointing at a file that does not exist is deliberately harmless —
# decoration must never stop the application from starting.
#
# Recommended: 1920x1080 (16:9), JPG or PNG. The image is scaled to cover the
# window and cropped from the centre, so keep anything important away from the
# edges.
background_image = "assets/background.jpg"

# How much to darken the photo before controls are drawn on top. The window has
# light text; over a bright photo without this it becomes unreadable.
background_dim = 0.55
background_color = "#101014"

[models]
root_path = "models"
# sha256 performs no network access unless this is explicitly enabled.
allow_downloads = false

[output]
# What leaves the pipeline for the virtual camera (day 15, his two asks):
#
# quality — the published picture is scaled down to this height, passed
# through a JPEG at a quality to match (1080p/90, 720p/65, 480p/50, 360p/40)
# and scaled straight back up to the camera's own size, so the stream's format
# never changes and Zoom or Meet see one stream; at 480p the mask's edge, a
# stubble mismatch and the small defects of a generated face are below what
# the picture can carry — an ordinary webcam's look, 360p a poor connection's.
# "native" leaves it alone. On the 720p camera 1080p and 720p do not resize;
# the JPEG alone is their step.
quality = "native"
# The black screen: this line, centred, in place of the avatar — by the button
# in the window and the hotkey below, and on its own when the engine cannot
# work (the camera's own picture about to go out, or the face lost for
# lost_face_seconds). It appears at once, stays min_blackout_seconds at least,
# and lifts only after the face has been tracked for recovery_seconds.
failure_text = "Camera battery died"
auto_blackout = true
lost_face_seconds = 1.5
min_blackout_seconds = 3.0
recovery_seconds = 1.0
# Toggles the black screen from any application (Windows; the meeting app is
# in front during a call). Modifiers ctrl / alt / shift / win plus a letter, a
# digit or F1-F24.
blackout_hotkey = "ctrl+alt+b"
